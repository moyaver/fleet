# Fleet server configuration. Every key can also be set as FLEET_<SECTION>__<KEY>; secrets as
# FLEET_<…>_FILE. Check it with: docker compose run --rm fleet check-config

# Caddy is the proxy in front of Fleet, on the Compose network whose subnet docker-compose.yml
# fixes. Its X-Forwarded-For names the real client, so per-IP limits count clients, not Caddy.
trusted_proxies = ["10.77.0.0/24"]

[[projects]]
slug = "mobile-app"
name = "Mobile app"

# GitHub Actions publishers (OIDC, no stored secret). IDs are GitHub's immutable numeric IDs:
#   gh api repos/OWNER/REPO --jq '.id, .owner.id'
# [[projects.trust_policies]]
# name = "mobile-app-ci"
# repository_id = 123456789
# repository_owner_id = 987654321
# trusted_refs = ["refs/heads/main", "refs/tags/v*"]
# pr_policy = "restricted"     # restricted | full | deny
