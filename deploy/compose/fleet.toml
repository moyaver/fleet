# Fleet server configuration. Every key can also be set as FLEET_<SECTION>__<KEY>; secrets as
# FLEET_<…>_FILE. Check it with: docker compose run --rm fleet check-config

[[projects]]
slug = "mobile-app"
name = "Mobile app"

# GitHub Actions publishers (OIDC, no stored secret). IDs are GitHub's immutable numeric IDs:
#   gh api repos/OWNER/REPO --jq '.id, .owner.id'
