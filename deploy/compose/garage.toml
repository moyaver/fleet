# Garage, one node (Garage v2.5). The RPC secret comes from GARAGE_RPC_SECRET_FILE (a Docker secret).
# No [s3_web] section: the website endpoint is off, so no bucket is served anonymously. The S3 API
# only accepts signed requests.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "0.0.0.0:3901"   # IPv4: Docker networks have IPv6 off by default
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"
