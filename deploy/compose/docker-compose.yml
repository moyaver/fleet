# SPDX-License-Identifier: AGPL-3.0-only
# Fleet reference deployment (research 06 §9.6): Caddy → Fleet → Postgres 18, plus Garage as the
# S3-compatible object store (artifacts are relayed through Fleet into it).
# Quick start: deploy/compose/README.md.
name: fleet

x-restart: &restart
  restart: unless-stopped

services:
  proxy:
    <<: *restart
    image: caddy:2.10
    ports: ["80:80", "443:443"]
    environment:
      FLEET_DOMAIN: ${FLEET_DOMAIN:-localhost}
      FLEET_USERCONTENT_DOMAIN: ${FLEET_USERCONTENT_DOMAIN:-usercontent.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      fleet: { condition: service_healthy }

  fleet:
    <<: *restart
    image: ${FLEET_IMAGE:-ghcr.io/moyaver/fleet:0.1.0-alpha.4}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["serve"]
    environment:
      FLEET_LISTEN: 0.0.0.0:8080
      FLEET_CONFIG: /etc/fleet/fleet.toml
      FLEET_DATABASE__URL_FILE: /run/secrets/database_url
      FLEET_DATABASE__MIGRATE: auto           # "manual" for IT-controlled upgrades (fleet migrate)
      FLEET_API__VIEWER_TOKENS_FILE: /run/secrets/viewer_token
      FLEET_API__PUBLIC_URL: https://${FLEET_DOMAIN:-localhost}
      # Uploaded files are served from a second site (invariant I7); see the Caddyfile.
      FLEET_USERCONTENT__URL: https://${FLEET_USERCONTENT_DOMAIN:-usercontent.localhost}
      FLEET_USERCONTENT__SIGNING_KEY_FILE: /run/secrets/usercontent_key
      # Agents upload through Fleet into Garage, which stays internal. To let agents upload
      # straight to Garage, publish its S3 API at a reachable TLS host and set
      # FLEET_STORAGE__S3__PUBLIC_ENDPOINT to that URL (operator guide: Direct upload).
      FLEET_STORAGE__BACKEND: s3
      FLEET_STORAGE__S3__ENDPOINT: http://garage:3900
      FLEET_STORAGE__S3__BUCKET: fleet-artifacts
      # The S3 key pair comes from Docker secrets, never from .env (research 06 T20).
      FLEET_STORAGE__S3__ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      FLEET_STORAGE__S3__SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      FLEET_ARTIFACTS__SPOOL_DIR: /var/lib/fleet/spool
      FLEET_LOG: info
    volumes:
      - ./fleet.toml:/etc/fleet/fleet.toml:ro
      - fleet_spool:/var/lib/fleet/spool
    secrets: [database_url, viewer_token, usercontent_key, s3_access_key_id, s3_secret_access_key]
    depends_on:
      postgres: { condition: service_healthy }
    stop_grace_period: 30s                     # the WebSocket drain needs more than Docker's 10 s
    expose: ["8080"]                           # only the proxy is published

  postgres:
    <<: *restart
    image: postgres:18.6                      # pinned: an upgrade is an edit here, never `latest` (research 06 T20)
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - pg_data:/var/lib/postgresql             # Postgres 18 images: mount the parent, not …/data
    secrets: [postgres_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fleet -d fleet"]
      interval: 5s
      retries: 12
    shm_size: 256mb

  garage:
    <<: *restart
    image: dxflrs/garage:v2.5.0
    # Single node, with a default key and bucket from the environment (no manual layout step).
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    # Garage 2.5 reads its RPC secret from a file, so the secret is a Docker secret, not an
    # environment variable (research 06 T20). Keep secrets/garage_rpc_secret mode 0400 on the host.
    environment:
      GARAGE_RPC_SECRET_FILE: /run/secrets/garage_rpc_secret
      GARAGE_DEFAULT_BUCKET: fleet-artifacts
    # Garage 2.5 has no file option for its default S3 key pair, so that pair is read from this
    # env file (secrets/garage.env, owner-only), not from .env. It must match the S3 key files
    # the server reads (see README.md). Known gap: it is in the container's environment.
    env_file: ./secrets/garage.env
    secrets: [garage_rpc_secret]
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    expose: ["3900"]                           # S3 API, internal only

# A fixed subnet, so the server can trust the proxy on it (fleet.toml trusted_proxies).
networks:
  default:
    ipam:
      config:
        - subnet: 10.77.0.0/24

volumes:
  fleet_spool: {}
  caddy_data: {}
  pg_data: {}
  garage_meta: {}
  garage_data: {}

secrets:
  database_url: { file: ./secrets/database_url }
  postgres_password: { file: ./secrets/postgres_password }
  viewer_token: { file: ./secrets/viewer_token }
  usercontent_key: { file: ./secrets/usercontent_key }
  s3_access_key_id: { file: ./secrets/s3_access_key_id }
  s3_secret_access_key: { file: ./secrets/s3_secret_access_key }
  garage_rpc_secret: { file: ./secrets/garage_rpc_secret }
