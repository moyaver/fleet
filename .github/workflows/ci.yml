name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every main push gets its own run (keyed by sha), so no main commit is cancelled and the badge never shows a cancelled run.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

jobs:
  ci:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    services:
      # The sqlx tests and `sqlx prepare --check` (PLAN §11.2). Each test makes its own database.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
          POSTGRES_DB: fleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fleet -d fleet"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://fleet:fleet@127.0.0.1:5432/fleet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All history and tags: the upgrade rehearsal exports each release tag's migrations.
          fetch-depth: 0
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          # Latest releases; keep the list in sync with TOOLS in xtask/src/main.rs.
          tool: cargo-nextest,cargo-deny,trunk,mdbook,sqlx-cli
      # The browser tests use the runner's preinstalled Chrome; xtask fetches the matching
      # chromedriver and the Tailwind CLI into target/tools.
      - run: cargo xtask ci
      # Uses DATABASE_URL (this job's Postgres 18); the test creates its own databases.
      - run: cargo xtask upgrade-rehearsal

  agent-macos:
    name: agent (macOS arm64)
    # The owner's Apple Silicon machine runs trusted code only: pushes and PRs from branches of
    # this repository. Fork PRs (untrusted code) stay on GitHub-hosted macOS.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64", "fleet-mac"]') || 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # A self-hosted runner keeps its target directory between runs.
        if: runner.environment == 'github-hosted'
      - run: cargo test --locked -p fleet-agent -p fleet-maestro -p fleet-core -p fleet-protocol
      - run: cargo build --locked --release -p fleet-agent

  action-smoke:
    # Installs the released agent through the composite action in install-only mode (no command, so
    # no Maestro, server or token). Proves the release archive matches sha256.sum, its build
    # attestation verifies, and the binary runs. Not covered: the run and job summary.
    name: fleet-agent action (install and verify)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read   # gh attestation verify, with the job's GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./examples/github-actions/fleet-agent
        with:
          version: v0.1.0-alpha.3
      - run: fleet-agent version
