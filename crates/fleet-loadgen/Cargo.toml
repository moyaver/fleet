[package]
name = "fleet-loadgen"
description = "Protocol load generator: simulated agents for load and resilience tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true


[[bin]]
name = "fleet-loadgen"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
fleet-protocol.workspace = true
futures-util.workspace = true
rustls.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite.workspace = true
uuid = { workspace = true, features = ["v7"] }

[package.metadata.dist]
# Not released by cargo-dist: the agent is (M2); the server ships as a container (M3).
dist = false
