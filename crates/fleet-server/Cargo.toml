[package]
name = "fleet-server"
description = "The fleet server: REST and WebSocket APIs, auth, background jobs and the embedded dashboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
figment.workspace = true
futures-util.workspace = true
getrandom.workspace = true
ipnet.workspace = true
fleet-blob.workspace = true
fleet-core.workspace = true
fleet-protocol = { workspace = true, features = ["openapi"] }
fleet-store.workspace = true
fleet-web-assets.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
signature.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync", "io-util"] }
tokio-util = { workspace = true, features = ["io"] }
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
utoipa.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
fleet-blob = { workspace = true, features = ["test-util"] }
sqlx.workspace = true
aws-lc-rs.workspace = true
axum-test.workspace = true
fleet-loadgen.workspace = true
fleet-store = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
wiremock.workspace = true
zip.workspace = true

[package.metadata.dist]
# Not released by cargo-dist: the agent is (M2); the server ships as a container (M3).
dist = false
