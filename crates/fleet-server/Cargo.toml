[package]
name = "fleet-server"
description = "The fleet server: REST and WebSocket APIs, auth, background jobs and the embedded dashboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
figment.workspace = true
fleet-protocol.workspace = true
fleet-store.workspace = true
fleet-web-assets.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync", "io-util"] }
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
fleet-store = { workspace = true, features = ["test-util"] }
futures-util.workspace = true
time.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true

[package.metadata.dist]
# Not released by cargo-dist: the agent is (M2); the server ships as a container (M3).
dist = false
