# Example: run a Maestro suite under the Fleet agent on GitHub Actions.
# The agent passes Maestro's output and exit status through unchanged; telemetry is best-effort.
name: e2e

on: [pull_request]

permissions:
  contents: read
  id-token: write   # the agent exchanges the job's OIDC token for a Fleet agent token

jobs:
  maestro:
    runs-on: ubuntu-latest
    env:
      FLEET_SERVER: https://fleet.example.com  # unset = offline: journal and spool only
      # No FLEET_TOKEN needed with id-token: write. Without OIDC, use an API key:
      # FLEET_TOKEN: ${{ secrets.FLEET_TOKEN }}
      FLEET_JOB_KEY: ${{ job.check_run_id }}   # unique per job, matrix legs included
      FLEET_RUN_DIR: ${{ runner.temp }}/fleet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # … build the app, start an emulator, install Maestro …
      # Installs the pinned agent (checksum-verified) and runs the command under it. The job summary
      # goes to the run page. `@main` until a release includes the action: then pin its tag.
      - uses: moyaver/fleet/examples/github-actions/fleet-agent@main
        with:
          command: maestro test .maestro/
      - name: Send anything the agent couldn't deliver
        if: always()
        run: test ! -f "$FLEET_RUN_DIR/spool.bin" || fleet-agent flush "$FLEET_RUN_DIR/spool.bin" || true
