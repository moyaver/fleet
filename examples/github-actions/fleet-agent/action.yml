# Runs a Maestro command under the Fleet agent. The agent passes Maestro's output and exit status
# through unchanged; telemetry is best-effort. Needs `permissions: id-token: write` for OIDC.
name: Run Maestro under Fleet
description: >-
  Installs a pinned fleet-agent release, checked against its GitHub build attestation (required by
  default), and runs a Maestro command under it. Maestro's output and exit status are unchanged. A
  job summary is written to GITHUB_STEP_SUMMARY.
inputs:
  command:
    description: >-
      Maestro command to run under the agent, for example `maestro test .maestro/`. Words are split
      as a shell splits them for quotes and backslashes, so `maestro test "my flows/"` passes one
      argument `my flows/`. Nothing is expanded or evaluated. Empty only installs the agent.
    required: false
    default: ""
  install:
    description: >-
      `true` installs the pinned release named by `version`. `false` runs the fleet-agent already on
      PATH, for example one built from this repository.
    required: false
    default: "true"
  version:
    description: fleet-agent release tag to install, when `install` is true.
    required: false
    default: v0.1.0-alpha.3
  server:
    description: >-
      Fleet server URL (FLEET_SERVER). Empty keeps the job's own setting; unset means offline.
    required: false
    default: ""
  github-token:
    description: >-
      Token for `gh attestation verify`, with `attestations: read`. Defaults to the job's GITHUB_TOKEN,
      which needs `permissions: attestations: read` in the workflow.
    required: false
    default: ""
  verify-attestation:
    description: >-
      `true` (the default) requires the release's build attestation to verify, against the `gh` CLI and
      a token, and takes the archive's expected SHA-256 from that attestation. `false` skips the check
      with a warning; the archive is then not authenticated.
    required: false
    default: "true"
outputs:
  summary-file:
    description: >-
      The file the job summary was appended to (GITHUB_STEP_SUMMARY of the run step), so a later
      step can read it. Empty when the run step did not start.
    value: ${{ steps.run.outputs.summary-file }}
runs:
  using: composite
  steps:
    - name: Install fleet-agent
      if: inputs.install == 'true'
      shell: bash
      env:
        AGENT_VERSION: ${{ inputs.version }}
        VERIFY_ATTESTATION: ${{ inputs.verify-attestation }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        set -euo pipefail
        if ! [[ "$AGENT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          echo "::error::version must be a release tag such as v0.1.0-alpha.3, not '$AGENT_VERSION'"
          exit 1
        fi
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) target=x86_64-unknown-linux-musl ;;
          Linux-aarch64 | Linux-arm64) target=aarch64-unknown-linux-musl ;;
          Darwin-arm64) target=aarch64-apple-darwin ;;
          *)
            echo "::error::no fleet-agent release for $(uname -s) $(uname -m)"
            exit 1
            ;;
        esac
        base="https://github.com/moyaver/fleet/releases/download/$AGENT_VERSION"
        archive="fleet-agent-$target.tar.xz"
        dir="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/fleet-agent"
        mkdir -p "$dir"
        curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$dir/$archive" "$base/$archive"
        # The expected digest comes from the build attestation, signed by the release workflow and
        # recorded in Sigstore's transparency log. It does not come from sha256.sum, which is
        # served from the same release as the archive and so proves nothing about it (research 06 T18).
        case "$VERIFY_ATTESTATION" in
          true)
            if ! command -v gh > /dev/null 2>&1; then
              echo "::error::verify-attestation is true but the gh CLI is not installed; install gh or set verify-attestation: false"
              exit 1
            fi
            if ! command -v jq > /dev/null 2>&1; then
              echo "::error::verify-attestation is true but jq is not installed"
              exit 1
            fi
            if [ -z "$GH_TOKEN" ]; then
              echo "::error::verify-attestation is true but there is no token: grant attestations: read, or set github-token"
              exit 1
            fi
            attestation="$dir/attestation.json"
            if ! gh attestation verify "$dir/$archive" --repo moyaver/fleet --format json > "$attestation"; then
              echo "::error::the build attestation for $archive does not verify"
              exit 1
            fi
            expected=$(jq -r '.[].verificationResult.statement.subject[]?.digest.sha256 // empty' "$attestation")
            if command -v sha256sum > /dev/null 2>&1; then
              actual=$(sha256sum "$dir/$archive" | cut -d' ' -f1)
            else
              actual=$(shasum -a 256 "$dir/$archive" | cut -d' ' -f1)
            fi
            if [ -z "$expected" ] || ! grep -Fxq "$actual" <<< "$expected"; then
              echo "::error::checksum mismatch for $archive: its digest is not among those in the build attestation"
              exit 1
            fi
            ;;
          false)
            echo "::warning::build attestation not checked (verify-attestation: false): the archive is not authenticated"
            ;;
          *)
            echo "::error::verify-attestation must be true or false, not '$VERIFY_ATTESTATION'"
            exit 1
            ;;
        esac
        tar -xJf "$dir/$archive" -C "$dir"
        bin="$dir/fleet-agent-$target"
        "$bin/fleet-agent" version
        echo "$bin" >> "$GITHUB_PATH"
    - name: Run Maestro under Fleet
      id: run
      if: inputs.command != ''
      shell: bash
      env:
        AGENT_COMMAND: ${{ inputs.command }}
        AGENT_SERVER: ${{ inputs.server }}
        SPLIT_COMMAND: ${{ github.action_path }}/split-command.sh
      run: |
        set -euo pipefail
        if [ -n "$AGENT_SERVER" ]; then
          export FLEET_SERVER="$AGENT_SERVER"
        fi
        # shellcheck disable=SC1090 # the path is the action's own split-command.sh
        . "$SPLIT_COMMAND"
        if ! split_command "$AGENT_COMMAND"; then
          echo "::error::the command has an unterminated quote"
          exit 1
        fi
        if [ "${#WORDS[@]}" -eq 0 ]; then
          echo "::error::the command is empty"
          exit 1
        fi
        # The job summary's file, for a later step that wants to read it (see `outputs`).
        echo "summary-file=$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"
        fleet-agent run -- "${WORDS[@]}"
