# Runs a Maestro command under the Fleet agent. The agent passes Maestro's output and exit status
# through unchanged; telemetry is best-effort. Needs `permissions: id-token: write` for OIDC.
name: Run Maestro under Fleet
description: >-
  Installs a pinned, checksum-verified fleet-agent release and runs a Maestro command under it.
  Maestro's output and exit status are unchanged. A job summary is written to GITHUB_STEP_SUMMARY.
inputs:
  command:
    description: >-
      Maestro command to run under the agent, split on whitespace, for example
      `maestro test .maestro/`. Empty only installs the agent.
    required: false
    default: ""
  version:
    description: fleet-agent release tag to install.
    required: false
    default: v0.1.0-alpha.1
  server:
    description: >-
      Fleet server URL (FLEET_SERVER). Empty keeps the job's own setting; unset means offline.
    required: false
    default: ""
  github-token:
    description: >-
      Token for `gh attestation verify`. Defaults to the job's GITHUB_TOKEN. Verification runs only
      when the `gh` CLI is installed.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install fleet-agent
      shell: bash
      env:
        AGENT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        set -euo pipefail
        if ! [[ "$AGENT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          echo "::error::version must be a release tag such as v0.1.0-alpha.1, not '$AGENT_VERSION'"
          exit 1
        fi
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) target=x86_64-unknown-linux-musl ;;
          Linux-aarch64 | Linux-arm64) target=aarch64-unknown-linux-musl ;;
          Darwin-arm64) target=aarch64-apple-darwin ;;
          *)
            echo "::error::no fleet-agent release for $(uname -s) $(uname -m)"
            exit 1
            ;;
        esac
        base="https://github.com/moyaver/fleet/releases/download/$AGENT_VERSION"
        archive="fleet-agent-$target.tar.xz"
        dir="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/fleet-agent"
        mkdir -p "$dir"
        curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$dir/$archive" "$base/$archive"
        curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$dir/sha256.sum" "$base/sha256.sum"
        # A checksum mismatch fails the job. Other problems with the file list do too.
        grep -F " *$archive" "$dir/sha256.sum" > "$dir/expected.sum" \
          || { echo "::error::$archive is not listed in sha256.sum"; exit 1; }
        (
          cd "$dir"
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum -c expected.sum
          else
            shasum -a 256 -c expected.sum
          fi
        ) || { echo "::error::checksum mismatch for $archive"; exit 1; }
        if command -v gh > /dev/null 2>&1 && [ -n "$GH_TOKEN" ]; then
          gh attestation verify "$dir/$archive" --repo moyaver/fleet
        else
          echo "::notice::build attestation not checked: the gh CLI or a token is not available"
        fi
        tar -xJf "$dir/$archive" -C "$dir"
        bin="$dir/fleet-agent-$target"
        "$bin/fleet-agent" version
        echo "$bin" >> "$GITHUB_PATH"
    - name: Run Maestro under Fleet
      if: inputs.command != ''
      shell: bash
      env:
        AGENT_COMMAND: ${{ inputs.command }}
        AGENT_SERVER: ${{ inputs.server }}
      run: |
        if [ -n "$AGENT_SERVER" ]; then
          export FLEET_SERVER="$AGENT_SERVER"
        fi
        read -r -a maestro <<< "$AGENT_COMMAND"
        fleet-agent run -- "${maestro[@]}"
