[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.99"
# See LICENSING.md. Application crates, not libraries: they are not published to crates.io.
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/moyaver/fleet"

# Lints: see docs/CONVENTIONS.md. All warn; CI runs with -D warnings. Exceptions are
# #[expect(lint, reason = "...")] in source: members cannot override [workspace.lints].
[workspace.lints.rust]
# deny, not forbid: crates/fleet-agent/src/sys.rs alone may opt out (checked by xtask lint).
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
ambiguous_negative_literals = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unit_bindings = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Unpublished app crates: documented thiserror variants carry the error contract.
missing_errors_doc = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
unwrap_used = "warn"
exit = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
mod_module_files = "warn"
clone_on_ref_ptr = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"

[workspace.lints.rustdoc]
unescaped_backticks = "warn"

[workspace.dependencies]
fleet-blob = { path = "crates/fleet-blob" }
fleet-core = { path = "crates/fleet-core" }
fleet-loadgen = { path = "crates/fleet-loadgen" }
fleet-maestro = { path = "crates/fleet-maestro" }
fleet-protocol = { path = "crates/fleet-protocol" }
fleet-server = { path = "crates/fleet-server" }
fleet-store = { path = "crates/fleet-store" }
fleet-ui = { path = "crates/fleet-ui" }
fleet-web-assets = { path = "crates/fleet-web-assets" }

anyhow = "1.0.104"
async-trait = "0.1.92"
assert_cmd = "2.2.2"
# Tests only: signs fake CI OIDC tokens with a key generated per test run.
aws-lc-rs = "1.19.0"
# Tests only: drives the server's router in-process (PLAN §5.3).
axum-test = { version = "21.1.0", default-features = false, features = ["ws"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing", "ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
console_error_panic_hook = "0.1.7"
crc32fast = "1.5.4"
# figment: configuration from TOML, `FLEET_*` and `*_FILE` (research 03 §11).
# WebDriver client for the browser tests; no TLS: chromedriver is on localhost.
fantoccini = { version = "0.22.1", default-features = false }
figment = { version = "0.10.19", features = ["toml", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
futures-channel = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
glob = "0.3.4"
# REST and the live WebSocket in the browser; members add the features they use.
gloo-net = { version = "0.7.0", default-features = false }
gloo-timers = { version = "0.4.0", default-features = false }
# JWT parsing and validation for CI OIDC tokens (ADR-0008). No built-in backend: Fleet installs an
# RS256 verifier on `ring` (fleet-server oidc), avoiding `rsa`/`crypto-bigint` advisories and aws-lc.
http = "1.5.0"
# CIDR blocks for `trusted_proxies` (fleet-server). Already in the tree through hyper.
ipnet = { version = "2.12.2", features = ["serde"] }
js-sys = "0.3.107"
jsonwebtoken = { version = "11.1.0", default-features = false }
# Plain HTTP connector for fantoccini.
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
# Magic-byte file type detection for artifact verification (PLAN §7.6).
infer = { version = "0.22.0", default-features = false }
insta = { version = "1.49.0", features = ["json"] }
leptos = { version = "0.8.23", features = ["csr"] }
# Client-side routing for the dashboard; pinned exactly (PLAN §5.4).
leptos_router = "=0.8.17"
nix = { version = "0.31.3", features = ["signal", "process", "resource"] }
# S3-compatible storage (ADR-0007). `aws-base` + `reqwest` + `ring`, not `aws`: that feature links
# aws-lc-rs and a second TLS backend; Fleet runs rustls on ring (the workspace reqwest above).
object_store = { version = "0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"] }
predicates = "3.1.4"
# Validates golden frames against the generated schema (dev-dependency only).
jsonschema = { version = "0.60.2", default-features = false }
proptest = "1.12.0"
quick-xml = "0.42.0"
regex = "1.13.1"
# OIDC discovery and JWKS. TLS via rustls with ring and the OS trust store (corporate CAs).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
# RS256 signature verification for OIDC tokens; already linked through rustls.
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
# JSON Schema of the wire types (`fleet-protocol` `schema` feature, PLAN §5.3).
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
# Postgres only (ADR-0006). TLS trusts the OS store, so corporate CAs work (research 03 §4).
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time", "json", "tls-rustls-ring-native-roots"] }
signal-hook = "0.4.6"
# The verifier trait jsonwebtoken's pluggable crypto uses.
signature = "2.2.0"
# Streaming tar reader for artifact bundles; no xattr, nothing is ever unpacked to disk.
tar = { version = "0.4.46", default-features = false }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
# Members add the features they need: features unify across the graph.
tokio = "1.54.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# OpenAPI 3.1 from the REST types (PLAN §5.3). No UI: it would ship JavaScript (I9).
utoipa = { version = "6.0.0", default-features = false, features = ["macros", "uuid", "time"] }
# Builds the IdP redirect and the token request body (browser sign-in).
url = "2.5.8"
uuid = { version = "1.29.0", features = ["serde"] }
# Pure-Rust zstd decoder (no C toolchain) for tar.zst artifact bundles.
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
vte = { version = "0.15.0", default-features = false }
webpki-roots = "1.0.11"
# Reads artifact archives without extracting; stored and deflate entries only.
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Tests only: the fake OIDC provider for browser sign-in.
wiremock = "0.6.5"
# Browser APIs for the canvas views; members add the web-sys features they use.
web-sys = "0.3.107"

[profile.release]
lto = true
codegen-units = 1
# panic stays "unwind": an observer panic must not take down the supervisor (I1, I2).

# Trunk builds fleet-web with `--release`; keep the wasm small. PLAN §5.4.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"

# Release archives built by cargo-dist (dist-workspace.toml): release settings, stripped.
[profile.dist]
inherits = "release"
strip = "symbols"
