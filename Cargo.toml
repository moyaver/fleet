[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
# See LICENSING.md. Application crates, not libraries: they are not published to crates.io.
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/moyaver/fleet"

# Lints: see docs/CONVENTIONS.md. All warn; CI runs with -D warnings. Exceptions are
# #[expect(lint, reason = "...")] in source: members cannot override [workspace.lints].
[workspace.lints.rust]
# deny, not forbid: crates/fleet-agent/src/sys.rs alone may opt out (checked by xtask lint).
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
ambiguous_negative_literals = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unit_bindings = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Unpublished app crates: documented thiserror variants carry the error contract.
missing_errors_doc = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
unwrap_used = "warn"
exit = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
mod_module_files = "warn"
clone_on_ref_ptr = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"

[workspace.lints.rustdoc]
unescaped_backticks = "warn"

[workspace.dependencies]
fleet-core = { path = "crates/fleet-core" }
fleet-maestro = { path = "crates/fleet-maestro" }
fleet-protocol = { path = "crates/fleet-protocol" }
fleet-store = { path = "crates/fleet-store" }
fleet-web-assets = { path = "crates/fleet-web-assets" }

anyhow = "1.0.104"
assert_cmd = "2.2.2"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
console_error_panic_hook = "0.1.7"
crc32fast = "1.5.4"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
insta = { version = "1.49.0", features = ["json"] }
leptos = { version = "0.8.23", features = ["csr"] }
nix = { version = "0.31.3", features = ["signal", "process", "resource"] }
predicates = "3.1.4"
proptest = "1.12.0"
quick-xml = "0.42.0"
regex = "1.13.1"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Postgres only (ADR-0006). TLS trusts the OS store, so corporate CAs work (research 03 §4).
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time", "json", "tls-rustls-ring-native-roots"] }
signal-hook = "0.4.6"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
# Members add the features they need: features unify across the graph.
tokio = "1.54.1"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
# panic stays "unwind": an observer panic must not take down the supervisor (I1, I2).

# Trunk builds fleet-web with `--release`; keep the wasm small. PLAN §5.4.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"

# Release archives built by cargo-dist (dist-workspace.toml): release settings, stripped.
[profile.dist]
inherits = "release"
strip = "symbols"
